name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs-freshness hint (base branch) and the releases.json check (latest release tag)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Panel script parses
        run: npm run check:panel
      - name: Version consistency, releases.json, docs and lean code (knip, jscpd, panel size)
        run: node scripts/ci-checks.mjs
      - name: Panel never sticks on navigation (headless Chrome, fast tab switching on a slow network, hung request → Retry)
        run: npm run check:responsive -- --only nav-stress,load-failed,load-retry --widths 393,1440 --schemes light
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

  scripts-and-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts
        run: |
          for f in install.sh deploy/*.sh deploy/duniya deploy/ops/duniya-ops infra/oci/bootstrap.sh infra/gcp/deploy.sh; do bash -n "$f"; done
          shellcheck -S warning install.sh deploy/*.sh deploy/duniya deploy/ops/duniya-ops infra/oci/bootstrap.sh infra/gcp/deploy.sh
      - name: Installer dry run
        run: bash install.sh --dry-run --yes --domain agents.example.com
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - name: Terraform (OCI stack)
        working-directory: infra/oci
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: duniya:ci
