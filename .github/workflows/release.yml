name: Release

# A release is made when package.json on main has a version that has no tag yet (bump the version → release),
# when a vX.Y.Z tag is pushed, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["package.json", ".github/workflows/release.yml"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $version"; exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build OCI Resource Manager stack zip
        if: steps.v.outputs.skip == 'false'
        run: cd infra/oci && zip -r ../../whatsapp-agent-duniya.zip . -x '.terraform/*' '*.tfstate*' 'backend.tf'

      - name: Create GitHub release (creates the tag if needed)
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" whatsapp-agent-duniya.zip \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.version }}" --generate-notes

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip == 'false'
      - uses: docker/login-action@v3
        if: steps.v.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image (amd64 + arm64)
        if: steps.v.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
