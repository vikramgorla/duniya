name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/panel/public/diff.js', '.github/workflows/mobile.yml'] # diff.js: the app's diff.ts is compared with it
  pull_request:
    paths: ['mobile/**', 'src/panel/public/diff.js', '.github/workflows/mobile.yml'] # diff.js: the app's diff.ts is compared with it

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: No unused files, exports or dependencies (knip)
        run: npm run knip
      - name: Expo config is valid
        run: npx expo config --type public > /dev/null
