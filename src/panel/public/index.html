<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duniya · WhatsApp agents</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e4e2da;
    --accent: #0f6e56; --accent-soft: #e1f5ee; --warn: #854f0b; --warn-soft: #faeeda;
    --bad: #a32d2d; --bad-soft: #fcebeb; --info: #185fa5; --info-soft: #e6f1fb; --radius: 10px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #201f1d; --ink: #ecebe6; --muted: #a09e96; --line: #34332f;
      --accent: #5dcaa5; --accent-soft: #0d3a2e; --warn: #ef9f27; --warn-soft: #3a2a10;
      --bad: #f09595; --bad-soft: #3d1a1a; --info: #85b7eb; --info-soft: #102a45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1100px; margin: 0 auto; }
  .brand { font-weight: 600; } .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
  .dot.ok { background: #1d9e75; } .dot.warn { background: #ba7517; } .dot.bad { background: #e24b4a; }
  nav { display: flex; gap: 2px; overflow-x: auto; padding: 0 12px; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
  nav button { background: none; border: 0; padding: 10px 12px; color: var(--muted); font: inherit; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  .card h3 { font-size: 14px; margin: 16px 0 6px; font-weight: 600; }
  fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 0 0 14px; min-width: 0; }
  legend { font-weight: 600; padding: 0 6px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .row > input, .row > select, .row > div { flex: 1; min-width: 120px; }
  .spread { justify-content: space-between; } .nowrap { flex-wrap: nowrap; }
  button.btn, .btn { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); }
  .note { background: var(--info-soft); color: var(--info); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.ok { background: var(--accent-soft); color: var(--accent); }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { border-bottom: 1px solid var(--line); padding: 8px 2px; cursor: pointer; }
  .feed li:last-child { border-bottom: 0; }
  .feed .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .feed .sum { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 360px; }
  table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; } th { font-size: 12px; color: var(--muted); font-weight: 500; }
  td.c, th.c { text-align: center; }
  .toggle { position: relative; width: 40px; height: 22px; flex: none; display: inline-block; margin: 0; } .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .toggle span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .toggle input:checked + span { background: var(--accent); } .toggle input:checked + span::after { transform: translateX(18px); }
  .toggle input:disabled + span { opacity: .5; cursor: default; }
  .qr { background: #fff; padding: 8px; border-radius: 8px; width: 220px; max-width: 100%; }
  .center { min-height: 80vh; display: grid; place-items: center; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: 90vw; }
  .chatlog { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; margin: 10px 0; }
  .bubble { padding: 8px 10px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
  .bubble.me { align-self: flex-end; background: var(--accent-soft); } .bubble.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
  .hide { display: none !important; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 22px; letter-spacing: 3px; font-weight: 600; }
  .readonly .mut { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>

const TYPE_CLASS = { 'message.in': 'info', 'message.out': 'ok', 'tool.call': '', 'tool.error': 'bad', error: 'bad', 'confirm.created': 'warn', 'confirm.applied': 'ok', 'confirm.cancelled': 'warn', 'channel.status': 'info', 'schedule.run': 'info', 'bot.updated': '', 'bot.created': 'ok', 'bot.deleted': 'warn', system: '', 'memory.summary': 'info', 'memory.history': '', 'memory.note.added': 'ok', 'memory.note.removed': 'warn', 'memory.erased': 'bad', 'model.usage': '', 'backup.done': 'ok', 'backup.restore': 'warn', 'backup.settings': '' };

const lines = (arr) => (arr || []).join('\n');

// ---------- state ----------
const S = { tab: 'overview', user: null, status: null, feed: [], feedBot: '', es: null, editing: null };

const TABS = () => [['overview', 'Overview'], ['activity', 'Activity'], ['bots', 'Bots'], ['chats', 'Chats'], ['models', 'Models'],
  can('owner') && ['backups', 'Backups'], ['pending', 'Pending'], ['secrets', 'Secrets'], ['settings', 'Settings']].filter(Boolean);

// ---------- login & first-run setup ----------

      h('p', { class: 'small muted' }, 'Enter the one-time setup code shown by the installer (or in the server log: journalctl -u whatsapp-agent-duniya).'),
      field('Setup code', code), field('Username', user), field('Password', pw), err,
      h('button', { class: 'btn primary', style: 'width:100%;margin-top:8px' }, 'Create account'))));
    return code.focus();

  const user = h('input', { placeholder: 'Username', value: 'admin', autocomplete: 'username' });
  const pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
  app.append(h('div', { class: 'center' }, h('form', { class: 'card', style: 'width:min(360px,92vw)', onsubmit: async (e) => {

// ---------- shell ----------
let statusTimer = null;

  document.body.classList.toggle('readonly', !can('admin'));
  const nav = h('nav', {}, TABS().map(([id, label]) => h('button', { 'data-tab': id, onclick: () => (location.hash === `#${id}` ? show(id) : (location.hash = id)) }, label)));
  app.append(
    h('header', {}, h('div', { class: 'bar' }, h('span', { class: 'dot', id: 'wa-dot' }), h('div', { class: 'brand' }, 'Duniya', h('small', { id: 'brand-sub' }, 'agents')),
      h('div', { style: 'flex:1' }), h('span', { class: 'small muted' }, `${S.user.username} · ${S.user.role}`),
      h('button', { class: 'btn small', onclick: async () => { await api('POST', '/api/logout').catch(() => {}); S.user = null; renderLogin(); } }, 'Sign out')), nav),
    h('main', { id: 'main' }));

async function refreshStatus() {

  const dot = $('#wa-dot'); if (dot) dot.className = `dot ${st === 'open' ? 'ok' : ['qr', 'reconnecting', 'starting'].includes(st) ? 'warn' : 'bad'}`;
  const sub = $('#brand-sub'); if (sub) sub.textContent = S.status.settings.paused ? 'paused' : `${S.status.bots.filter((b) => b.enabled).length} bots live`;

  const r = { overview: renderOverview, activity: renderActivity, bots: renderBots, chats: renderChats, models: renderModels, backups: renderBackups, pending: renderPending, secrets: renderSecrets, settings: renderSettings }[tab];

    if (S.tab === 'overview') { const r = $('#recent'); if (r) { r.prepend(feedItem(a)); while (r.children.length > 8) r.lastChild.remove(); } }

// ---------- overview ----------
let overviewBusy = false;

async function renderOverview(soft) {

    h('table', { style: 'margin-top:10px' }, h('tbody', {}, st.bots.length ? st.bots.map((b) => h('tr', {},

      h('td', { style: 'text-align:right' }, toggle(b.enabled, (v) => tryApi(async () => { await api('PUT', `/api/bots/${b.id}`, { enabled: v }); refreshStatus(); }, `${b.name} ${v ? 'on' : 'off'}`))))) : h('tr', {}, h('td', { class: 'muted' }, 'No bots yet — create one under Bots.')))),

    h('ul', { class: 'feed', id: 'recent' }, S.feed.slice(0, 8).map(feedItem)));
  $('#main').replaceChildren(h('div', { class: 'grid' }, wa, control, server, recent));
  if (!S.feed.length) api('GET', '/api/activity?limit=50').then((rows) => { S.feed = rows; $('#recent')?.replaceChildren(...rows.slice(0, 8).map(feedItem)); }).catch(() => {});

async function renderUpdates(box, note = '') {

      ? h('div', { class: 'note warn' }, h('b', {}, `Update available: ${st.latest}`), ` · running ${st.current}`)

  const updateBtn = st.available && u.install !== 'docker' ? h('button', { class: 'btn primary', onclick: async (e) => {
    if (!confirm(`Install ${st.latest} and restart? The bots pause for about a minute.`)) return;
    const from = st.current;
    box.querySelectorAll('button').forEach((b) => (b.disabled = true));

      b.github.connected ? h('div', {},
        field('Repository', h('div', { class: 'row' }, ghRepo, h('button', { class: 'btn', onclick: () => saveSettings({ github: { enabled: true, repo: ghRepo.value.trim() } }) }, 'Use'))),
        !s.github.repo ? h('button', { class: 'btn primary', style: 'margin-top:8px', onclick: () => tryApi(async () => { await api('POST', '/api/backups/github/create-repo', {}); renderBackups(); }, 'Private repo created') }, 'Create private repo “duniya-backups”') : null,
        h('div', { class: 'row', style: 'margin-top:8px' }, h('label', { class: 'inline' }, h('input', { type: 'checkbox', checked: s.github.enabled, onchange: (e) => saveSettings({ github: { enabled: e.target.checked } }) }), 'Back up to GitHub'),
          h('button', { class: 'btn small', onclick: async () => { const r = await api('POST', '/api/backups/test/github'); toast(r.ok ? 'GitHub OK' : r.error); } }, 'Test'),
          h('button', { class: 'btn small danger', onclick: () => confirm('Disconnect GitHub?') && tryApi(async () => { await api('DELETE', '/api/backups/github'); renderBackups(); }) }, 'Disconnect'))) : null,
      h('details', { style: 'margin-top:10px' }, h('summary', { class: 'small muted' }, 'GitHub app for device login'),
        h('p', { class: 'small muted' }, 'Device login needs a GitHub OAuth app with “Enable Device Flow” (github.com → Settings → Developer settings → OAuth Apps). Paste its client id:'),
        h('div', { class: 'row' }, clientId, h('button', { class: 'btn', onclick: () => tryApi(async () => { await api('PUT', '/api/backups/github/client-id', { clientId: clientId.value }); renderBackups(); }, 'Saved') }, 'Save')))),
    h('div', { class: 'card' }, h('h2', {}, 'S3-compatible storage'),
      h('p', { class: 'small muted' }, 'Cloudflare R2, OCI Object Storage (S3 API), AWS S3, MinIO…'),
      field('Endpoint', se), h('div', { class: 'row' }, field('Region', sr), field('Bucket', sb), field('Prefix', sp)),
      h('div', { class: 'row', style: 'margin-top:8px' }, ak, sk, h('button', { class: 'btn', onclick: () => tryApi(() => api('PUT', '/api/backups/s3/keys', { accessKeyId: ak.value, secretAccessKey: sk.value }), 'Keys saved') }, 'Save keys')),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('label', { class: 'inline' }, h('input', { type: 'checkbox', checked: s.s3.enabled, id: 's3on' }), 'Back up to S3'),
        h('button', { class: 'btn primary', onclick: () => saveSettings({ s3: { enabled: $('#s3on').checked, endpoint: se.value.trim(), region: sr.value.trim() || 'auto', bucket: sb.value.trim(), prefix: sp.value.trim() } }) }, 'Save'),
        h('button', { class: 'btn', onclick: async () => { const r = await api('POST', '/api/backups/test/s3'); toast(r.ok ? 'S3 OK' : r.error); } }, 'Test'))),
    h('div', { class: 'card' }, h('h2', {}, 'Restore'),
      h('div', { class: 'note warn' }, 'Restoring replaces bots, users, settings, secrets, memory and the WhatsApp link with the backup, then restarts. The current data is kept aside on the server.'),
      h('div', { class: 'row' }, src, h('button', { class: 'btn', onclick: loadFiles }, 'List')), h('div', { style: 'margin-top:6px' }, files), h('div', { style: 'margin-top:6px' }, rpass),
      h('button', { class: 'btn danger', style: 'margin-top:8px', onclick: async () => {
        if (!files.value) return toast('Pick a backup');
        if (!confirm(`Restore ${files.value}? The server restarts and you sign in with the accounts from the backup.`)) return;
        const r = await tryApi(() => api('POST', '/api/backups/restore', { source: src.value, file: files.value, passphrase: rpass.value }));
        if (r) { toast('Restoring… the page reloads shortly'); setTimeout(() => location.reload(), 10000); }
      } }, 'Restore'))));
  loadFiles();
}

// ---------- pending ----------
async function renderPending() {
  const rows = await api('GET', '/api/pending');
  $('#main').replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Pending confirmations'),
    h('p', { class: 'small muted' }, 'Changes an organizer asked for, waiting for “confirm CODE”. You can apply or cancel them here too.'),
    rows.length ? h('table', {}, h('tbody', {}, rows.map((p) => h('tr', {},
      h('td', {}, h('b', {}, p.code), h('div', { class: 'small muted' }, `${p.bot} · ${p.tool} · expires in ${Math.max(0, Math.round((p.expires - Date.now()) / 60000))} min`), h('pre', {}, p.summary)),
      h('td', { style: 'white-space:nowrap' }, h('button', { class: 'btn primary mut', onclick: async () => { const r = await tryApi(() => api('POST', `/api/pending/${p.code}/apply`)); if (r) toast(r.result); renderPending(); } }, 'Apply'), ' ',
        h('button', { class: 'btn mut', onclick: () => tryApi(async () => { await api('DELETE', `/api/pending/${p.code}`); renderPending(); }) }, 'Cancel')))))) : h('p', { class: 'muted' }, 'Nothing pending.')));
}

// ---------- secrets ----------
async function renderSecrets() {
  const rows = await api('GET', '/api/secrets');
  const name = h('input', { placeholder: 'NAME_LIKE_THIS' }); const val = h('input', { type: 'password', placeholder: 'value' });
  $('#main').replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Secrets'),
    h('p', { class: 'small muted' }, 'API keys and tokens, stored encrypted on the server and never shown again. Bots reference them as ${NAME}. Save an empty value to remove.'),
    h('table', {}, h('tbody', {}, rows.map((n) => { const v = h('input', { type: 'password', placeholder: 'new value' });
      return h('tr', {}, h('td', {}, h('code', {}, n.name), n.usedByBots ? h('div', { class: 'small muted' }, 'used by a bot') : null),
        h('td', {}, h('span', { class: `pill ${n.set ? 'ok' : 'bad'}` }, n.set ? 'set' : 'missing')),
        h('td', {}, h('form', { class: 'row mut', onsubmit: async (e) => { e.preventDefault(); if (await tryApi(() => api('PUT', '/api/secrets', { name: n.name, value: v.value }), v.value ? 'Saved' : 'Removed')) renderSecrets(); } }, v, h('button', { class: 'btn' }, 'Save')))); }))),
    h('div', { class: 'mut' }, h('label', {}, 'Add a secret'), h('form', { class: 'row', onsubmit: async (e) => { e.preventDefault(); if (await tryApi(() => api('PUT', '/api/secrets', { name: name.value.trim(), value: val.value }), 'Saved')) renderSecrets(); } }, name, val, h('button', { class: 'btn primary' }, 'Add')))));
}

// ---------- settings ----------
async function renderSettings() {
  const bots = await api('GET', '/api/bots');
  const cur = h('input', { type: 'password', placeholder: 'current', autocomplete: 'current-password' });
  const next = h('input', { type: 'password', placeholder: 'new (12+ characters)', autocomplete: 'new-password' });
  const cards = [
    h('div', { class: 'card' }, h('h2', {}, 'Your password'), cur, h('div', { style: 'height:8px' }), next,
      h('button', { class: 'btn primary', style: 'margin-top:10px', onclick: () => tryApi(async () => { await api('POST', '/api/password', { current: cur.value, next: next.value }); cur.value = next.value = ''; }, 'Password changed') }, 'Change password')),
    h('div', { class: 'card' }, h('h2', {}, 'Direct messages'), h('label', {}, 'Default bot for DMs without a trigger'),
      h('select', { disabled: !can('admin'), onchange: (e) => tryApi(() => api('POST', '/api/settings', { defaultDmBot: e.target.value }), 'Saved') },
        h('option', { value: '' }, '— first bot that accepts the sender —'), bots.map((b) => h('option', { value: b.id, selected: S.status?.settings?.defaultDmBot === b.id }, b.name)))),
    h('div', { class: 'card' }, h('h2', {}, 'WhatsApp helpers'), h('p', { class: 'small' }, 'Organizers of any bot can send:'),
      h('ul', { class: 'small' }, h('li', {}, h('code', {}, '!groupid'), ' in a group → replies with its id'), h('li', {}, h('code', {}, '!groups'), ' in a DM → lists all groups'))),
  ];
  if (can('owner')) {
    const users = await api('GET', '/api/users');
    const un = h('input', { placeholder: 'username' }); const ue = h('input', { placeholder: 'email (optional)' });
    const ur = h('select', {}, h('option', { value: 'admin' }, 'Admin'), h('option', { value: 'viewer' }, 'Viewer (read-only)'), h('option', { value: 'owner' }, 'Owner'));
    const up = h('input', { type: 'password', placeholder: 'initial password (12+)' });
    cards.unshift(h('div', { class: 'card', style: 'grid-column:1/-1' }, h('h2', {}, 'Users'),
      h('p', { class: 'small muted' }, 'Owners manage everything incl. users, backups and updates. Admins manage bots, chats, models and memory. Viewers can only look.'),
      h('table', {}, h('tbody', {}, users.map((u) => h('tr', {}, h('td', {}, h('b', {}, u.username), h('div', { class: 'small muted' }, u.email || '')),
        h('td', {}, h('select', { onchange: (e) => tryApi(() => api('PUT', `/api/users/${u.id}`, { role: e.target.value }), 'Role changed').then((r) => r || renderSettings()) },
          ['owner', 'admin', 'viewer'].map((r) => h('option', { value: r, selected: u.role === r }, r)))),
        h('td', {}, u.id === S.user.id ? h('span', { class: 'small muted' }, 'you') : h('button', { class: 'btn small danger', onclick: () => confirm(`Remove ${u.username}?`) && tryApi(async () => { await api('DELETE', `/api/users/${u.id}`); renderSettings(); }, 'Removed') }, 'Remove')))))),
      h('form', { class: 'row', style: 'margin-top:10px', onsubmit: async (e) => { e.preventDefault(); if (await tryApi(() => api('POST', '/api/users', { username: un.value, email: ue.value, role: ur.value, password: up.value }), 'User added')) renderSettings(); } },
        un, ue, ur, up, h('button', { class: 'btn primary' }, 'Add user'))));
  }
  $('#main').replaceChildren(h('div', { class: 'grid' }, cards));
}

window.addEventListener('hashchange', () => { if (S.user) show(location.hash.slice(1).split('/')[0] || 'overview'); });
renderLogin();
</script>
</body>
