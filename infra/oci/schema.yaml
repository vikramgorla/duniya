title: "WhatsApp agents (whatsapp-agent-duniya)"
description: "Self-hosted WhatsApp agents with an admin panel, on an Always Free VM."
schemaVersion: 1.1.0
version: "20261114"
locale: "en"

variableGroups:
  - title: "Admin panel"
    variables: [exposure, domain, cf_tunnel_token, admin_password, update_mode]
  - title: "Virtual machine"
    variables: [shape, a1_ocpus, a1_memory_gb, boot_volume_gb, ssh_public_key, ssh_ingress_cidr]
  - title: "Source"
    visible: false
    variables: [repo_url, branch, git_token, name]
  - title: "Hidden"
    visible: false
    variables: [tenancy_ocid, region, compartment_ocid]

variables:
  exposure:
    type: enum
    title: "How to reach the admin panel"
    description: "ip = https://<ip>.sslip.io (opens 80/443); domain = your domain (opens 80/443); tunnel = Cloudflare Tunnel (no open ports); local = SSH tunnel only"
    enum: [ip, domain, tunnel, local]
    default: ip
    required: true
  domain:
    type: string
    title: "Domain"
    description: "Only for exposure = domain. Point its DNS A record to the instance IP after apply."
    visible:
      eq: [exposure, domain]
  cf_tunnel_token:
    type: password
    title: "Cloudflare Tunnel token"
    visible:
      eq: [exposure, tunnel]
  admin_password:
    type: password
    title: "Owner password (optional)"
    description: "Creates user 'admin'. Leave empty to use the one-time setup code instead."
  update_mode:
    type: enum
    title: "Updates"
    enum: [notify, auto, "off"]
    default: notify
  shape:
    type: enum
    title: "Shape"
    enum: [VM.Standard.E2.1.Micro, VM.Standard.A1.Flex]
    default: VM.Standard.E2.1.Micro
    required: true
  a1_ocpus:
    type: number
    title: "OCPUs (A1 only)"
    default: 1
    minimum: 1
    maximum: 2
    visible:
      eq: [shape, VM.Standard.A1.Flex]
  a1_memory_gb:
    type: number
    title: "Memory GB (A1 only)"
    default: 4
    minimum: 1
    maximum: 12
    visible:
      eq: [shape, VM.Standard.A1.Flex]
  boot_volume_gb:
    type: number
    title: "Boot volume GB"
    default: 50
    minimum: 47
    maximum: 200
  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key (optional)"
    required: false
  ssh_ingress_cidr:
    type: string
    title: "Allow SSH from (optional CIDR, e.g. 203.0.113.4/32)"
    required: false
  tenancy_ocid:
    type: string
  region:
    type: oci:identity:region:name
  compartment_ocid:
    type: oci:identity:compartment:id
