title: "Duniya: AI agents on WhatsApp and Telegram"
description: "Self-hosted AI agents for WhatsApp and Telegram with an admin panel, on an Always Free VM."
schemaVersion: 1.1.0
version: "2.59.3"
locale: "en"

variableGroups:
  - title: "Admin panel"
    variables: [exposure, domain, cf_tunnel_token, admin_password, update_mode]
  - title: "Virtual machine"
    variables: [shape, a1_ocpus, a1_memory_gb, boot_volume_gb, ssh_public_key, ssh_ingress_cidr, enable_logs]
  - title: "Source"
    visible: false
    variables: [repo_url, branch, git_token, name]
  - title: "Hidden"
    visible: false
    variables: [tenancy_ocid, region, compartment_ocid]

variables:
  exposure:
    type: enum
    title: "How to reach the admin panel"
    description: "ip = https://<ip>.sslip.io (opens 80/443); domain = your domain (opens 80/443); tunnel = Cloudflare Tunnel (no open ports); local = SSH tunnel only"
    enum: [ip, domain, tunnel, local]
    default: ip
    required: true
  domain:
    type: string
    title: "Domain"
    description: "Only for exposure = domain. Point its DNS A record to the instance IP after apply."
    visible:
      eq: [exposure, domain]
  cf_tunnel_token:
    type: password
    title: "Cloudflare Tunnel token"
    visible:
      eq: [exposure, tunnel]
  admin_password:
    type: password
    title: "Owner password"
    description: "You sign in to the panel as user 'admin' with this password (min. 10 characters)."
    required: true
  update_mode:
    type: enum
    title: "Updates"
    enum: [notify, auto, "off"]
    default: notify
  shape:
    type: enum
    title: "Shape"
    enum: [VM.Standard.E2.1.Micro, VM.Standard.A1.Flex]
    default: VM.Standard.E2.1.Micro
    required: true
    description: "E2.1.Micro: x86, 1 GB, 1/8 CPU — always available but slow (first install about 20–30 minutes). A1.Flex: Arm, up to 2 CPU / 12 GB free — much faster, but Oracle sometimes has no capacity (then try again later or pick E2.1.Micro)."
  a1_ocpus:
    type: number
    title: "OCPUs (A1 only)"
    default: 1
    minimum: 1
    maximum: 2
    visible:
      eq: [shape, VM.Standard.A1.Flex]
  a1_memory_gb:
    type: number
    title: "Memory GB (A1 only)"
    default: 4
    minimum: 1
    maximum: 12
    visible:
      eq: [shape, VM.Standard.A1.Flex]
  boot_volume_gb:
    type: number
    title: "Boot volume GB"
    default: 50
    minimum: 47
    maximum: 200
  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key (optional)"
    required: false
  ssh_ingress_cidr:
    type: string
    title: "Allow SSH from (optional)"
    description: "Leave empty to keep SSH closed (recommended; see logs under Observability & Management > Logging). To open it, enter your IP, e.g. 203.0.113.4/32 (key-only login)."
    required: false
  enable_logs:
    type: boolean
    title: "Send logs to OCI Logging"
    description: "Paid (Pay As You Go) accounts only: Always Free accounts can't run log agents. Install progress is shown at the server address either way."
    default: false
  tenancy_ocid:
    type: string
  region:
    type: oci:identity:region:name
  compartment_ocid:
    type: oci:identity:compartment:id

# Resource Manager shows these as clickable links; the primary one becomes a button on the job page.
primaryOutputButton: panel_url

outputGroups:
  - title: "Open your panel"
    outputs: [install_progress_url, panel_url, panel_access]
  - title: "Copy"
    outputs: [panel_address, install_progress_address, public_ip]
  - title: "Details"
    outputs: [instance_id, manage_stack_url, logs_url]

outputs:
  panel_url:
    type: link
    title: "Admin panel"
    displayText: "Open the panel"
    visible: true
  install_progress_url:
    type: link
    title: "Install progress"
    displayText: "Watch the install"
    visible: true
  panel_address:
    type: copyableString
    title: "Panel address"
    visible: true
  install_progress_address:
    type: copyableString
    title: "Install progress address"
    visible: true
  panel_access:
    type: string
    title: "How to get in"
    visible: true
  public_ip:
    type: copyableString
    title: "Public IP"
    visible: true
  instance_id:
    type: ocid
    title: "VM"
    visible: true
  manage_stack_url:
    type: link
    title: "Manage stack"
    displayText: "Update or remove this deployment"
    visible: true
  logs_url:
    type: string
    title: "OCI Logging"
    visible: true
